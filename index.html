async function shrink(f){const b=await createImageBitmap(f);const k=Math.min(1,1280/Math.max(b.width,b.height));const c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',0.85))}

const cn=t=>String(t||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/[OILSBZ]/g,c=>({O:'0',I:'1',L:'1',S:'5',B:'8',Z:'2'})[c]);
function approx(h,n){if(!n)return false;const m=n.length>8?2:n.length>=5?1:0;for(let i=0;i+n.length<=h.length;i++){let e=0;for(let j=0;j<n.length&&e<=m;j++)if(h[i+j]!==n[j])e++;if(e<=m)return true}return false}
async function prep(blob,inv){const b=await createImageBitmap(blob),c=document.createElement('canvas');c.width=b.width;c.height=b.height;const x=c.getContext('2d');x.drawImage(b,0,0);
 const d=x.getImageData(0,0,c.width,c.height),p=d.data;for(let i=0;i<p.length;i+=4){let g=.3*p[i]+.59*p[i+1]+.11*p[i+2];g=Math.max(0,Math.min(255,(g-128)*1.5+128));if(inv)g=255-g;p[i]=p[i+1]=p[i+2]=g}x.putImageData(d,0,0);return new Promise(r=>c.toBlob(r,'image/png'))}
async function ocrCheck(blob,a){try{const T=await loadTess(),code=cn('ARENA'+a.code),id=cn(String(a.game_id).split('#')[0]);let txt='';
 for(const inv of [false,true]){const r=await T.recognize(await prep(blob,inv),'eng');txt+=cn(r.data.text);if(approx(txt,code)&&approx(txt,id))break}
 return{ran:true,code:approx(txt,code),id:approx(txt,id)}}catch(e){return{ran:false}}}

create index if not exists team_msgs_t on team_msgs(team_id, created_at desc);

create or replace function tp_member(t text) returns boolean language sql security definer stable set search_path=public as $$
  select exists(select 1 from teams where id::text=t and owner=auth.uid())
      or exists(select 1 from team_people where team_id=t and user_id=auth.uid() and status='active') $$;

create or replace function tp_manager(t text) returns boolean language sql security definer stable set search_path=public as $$
  select exists(select 1 from teams where id::text=t and owner=auth.uid())
      or exists(select 1 from team_people where team_id=t and user_id=auth.uid() and status='active' and role in ('captain','manager')) $$;

create or replace function tp_accept(t text) returns void language plpgsql security definer set search_path=public as $$
begin
  update team_people set status='active' where team_id=t and user_id=auth.uid() and status='invited';
  if not found then raise exception 'No invite found'; end if;
end $$;

create or replace function tp_cleanup() returns trigger language plpgsql security definer set search_path=public as $$
begin
  delete from team_people where team_id=old.id::text;
  delete from team_msgs where team_id=old.id::text;
  return old;
end $$;
drop trigger if exists tp_cleanup_t on teams;
create trigger tp_cleanup_t after delete on teams for each row execute function tp_cleanup();

grant execute on function tp_member(text), tp_manager(text), tp_accept(text) to authenticated;

alter table team_people enable row level security;
alter table team_msgs enable row level security;

drop policy if exists tp_sel on team_people;
create policy tp_sel on team_people for select to authenticated using (true);
drop policy if exists tp_ins on team_people;
create policy tp_ins on team_people for insert to authenticated with check (
  (user_id=auth.uid() and status='requested' and role='player') or (status='invited' and tp_manager(team_id)));
drop policy if exists tp_upd on team_people;
create policy tp_upd on team_people for update to authenticated using (tp_manager(team_id)) with check (tp_manager(team_id));
drop policy if exists tp_del on team_people;
create policy tp_del on team_people for delete to authenticated using (user_id=auth.uid() or tp_manager(team_id));

drop policy if exists tmsg_sel on team_msgs;
create policy tmsg_sel on team_msgs for select to authenticated using (tp_member(team_id));
drop policy if exists tmsg_ins on team_msgs;
create policy tmsg_ins on team_msgs for insert to authenticated with check (sender=auth.uid() and tp_member(team_id));

-- captains and managers can register / withdraw the team from tournaments
drop policy if exists te_mgr_ins on team_entries;
create policy te_mgr_ins on team_entries for insert to authenticated with check (tp_manager(team_id::text));
drop policy if exists te_mgr_del on team_entries;
create policy te_mgr_del on team_entries for delete to authenticated using (tp_manager(team_id::text));

-- "Seen" receipts: receivers may only change read_at
revoke update on dms from authenticated;
grant update(read_at) on dms to authenticated;
drop policy if exists dms_read on dms;
create policy dms_read on dms for update to authenticated using (receiver=auth.uid()) with check (receiver=auth.uid());

end $$;

const hs8=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};

function score(it,C){const now=Date.now();let s=(W[it.type]||30);
 const ageH=Math.max(0,(now-it.t)/36e5);s+=60*Math.exp(-ageH/20);
 if(it.type==='upcoming'&&it._k){const h=Math.max(0,(it._k-now)/36e5);s+=40*Math.exp(-h/12)}
 if(it.go||it.app)s+=25;if(it.mine)s+=60;
 if(it.g){const w=wt(it.g,C.mg);s+=w*1.15;if(!C.hasI&&C.top.has(it.g))s+=26;else if(C.hasI&&!w)s-=14}else if(C.hasI)s-=6;
 if((it.uids||[]).some(u=>C.f.has(u)))s+=35;
 if(it.cc&&it.cc===HF.cc)s+=26;
 if(C.loc.test(it.title+' '+(it.body||'')+' '+it.src))s+=22;
 s+=Math.min(15,(HF.like[it.type]||0)*3)+(it.plat?Math.min(12,(HF.like['p:'+it.plat]||0)*3):0);
 if(/espn/i.test(it.src))s+=4;if(HF.snap.has(it.id))s-=48;s+=(hs8(it.id+HF.seed)%1000)/1000*26;return s}

function diversify(list){const out=[],rest=list.slice();
 while(rest.length){let k=0;const a=out[out.length-1],b=out[out.length-2];

/* ---------- v10: AI Auto-Read (vision) + Spotter phone: automatic scoring with no manual entry ---------- */
const AIK='ap_aikey';
const normN=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
function grab(vid,crop,maxW){const vw=vid.videoWidth,vh=vid.videoHeight;if(!vw)return null;const sh=Math.round(vh*(crop||1)),sc=Math.min(1,maxW/vw),cv=document.createElement('canvas');cv.width=Math.round(vw*sc);cv.height=Math.round(sh*sc);cv.getContext('2d').drawImage(vid,0,0,vw,sh,0,0,cv.width,cv.height);return cv}
function thumb(cv){const t=document.createElement('canvas');t.width=32;t.height=18;const x=t.getContext('2d');x.drawImage(cv,0,0,32,18);return x.getImageData(0,0,32,18).data}
function tdiff(a,b){if(!a||!b)return 99;let s=0;for(let i=0;i<a.length;i+=4)s+=Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2]);return s/(a.length/4)/3}
function aiPrompt(game,mode){const k=gkey(game),H=(HEROES[k]||[]).map(x=>x[0]).join(', '),I=(ITEMS[k==='val'||k==='cod'?'val':'mlbb']||[]).map(x=>x[0]).join(', ');
 return `You read live esports HUD screenshots of ${game}. Team A = the LEFT side (usually blue) of the top scoreboard, Team B = the RIGHT side (usually red). Output ONLY compact JSON, no prose, in exactly this shape: {"time":"mm:ss"|null,"paused":true|false,"gameOver":"A"|"B"|null,"A":{"kills":n|null,"gold":n|null,"towers":n|null,"turtles":n|null,"lords":n|null},"B":{same},"players":null|[{"t":"A"|"B","s":1-5,"hero":string|null,"k":n,"d":n,"a":n,"gold":n|null,"items":[string]}]}. Rules: copy numbers exactly as displayed (12.3k = 12300). Use null when a value is not visible or you are not sure. Never guess or invent. "paused" is true only if a pause screen or PAUSED text is shown. "gameOver" only on a victory/defeat screen. ${mode==='hud'?'Only the top HUD strip is shown, so players MUST be null.':'"players" only if a per-player scoreboard or stats panel is visible, otherwise null.'}${H?' Known heroes: '+H+'.':''}${I?' Known items: '+I+'. Use these exact item names.':''}`}
async function aiCall(cv,key,model,game,mode){const b64=cv.toDataURL('image/jpeg',.82).split(',')[1];
 const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:900,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},{type:'text',text:aiPrompt(game,mode)}]}]})});
 if(r.status===401||r.status===403)throw Error('BADKEY');if(!r.ok)throw Error('HTTP '+r.status);
 const j=await r.json(),t=(j.content||[]).map(x=>x.text||'').join(''),m=t.match(/\{[\s\S]*\}/);if(!m)throw Error('no data');return JSON.parse(m[0])}
/* shared reader loop: runs on the host (own screen/camera) or on a Spotter phone */
function aiLoop(vid,cfg,onData,st){let stop=false,busy=false,n=0,last=null,lastSent=0;
 const tick=async()=>{if(stop||busy)return;if(!vid.videoWidth)return st('⏳ Waiting for video…');const full=(n%3===2),cv=grab(vid,full?1:.17,full?1280:1100),th=thumb(cv),d=tdiff(last,th);
  if(d<1.2&&Date.now()-lastSent<15000){st('😴 Screen unchanged · saving credits');n++;return}
  busy=true;try{const r=await aiCall(cv,cfg.key,cfg.model,cfg.game,full?'full':'hud');last=th;lastSent=Date.now();n++;onData(r);st('✅ Read '+(r.time||'--:--')+' · '+((r.A&&r.A.kills)??'?')+' - '+((r.B&&r.B.kills)??'?')+(r.players?' · players read':'')+' · '+new Date().toLocaleTimeString())}
  catch(e){if(e.message==='BADKEY'){st('❌ API key rejected. Check the key.');stop=true;clearInterval(iv)}else st('⚠️ '+e.message+' (retrying)')}busy=false};
 const iv=setInterval(tick,cfg.every||4000);tick();return()=>{stop=true;clearInterval(iv)}}

/* ----- apply a reading to the live match, with 2-read confirmation to block misreads ----- */
const nv=v=>(typeof v==='number'&&isFinite(v)&&v>=0)?v:null;
function cf(key,val,fn){const b=B;b.pend=b.pend||{};if(b.pend[key]===val){fn()}else b.pend[key]=val}
function mapItem(n){const IT=itemPool(B.k),l=normN(n);return IT.find(x=>normN(x[0])===l)||[String(n),'🎒']}
function aiKill(ti,pi){const b=B,p=b.T[ti].pl[pi];p.k++;pushFeed('⚔  '+p.n+' ('+p.h[0]+') got a kill',b.T[ti].col);
 p.ms=(b.time-p.lt<=12)?p.ms+1:1;p.lt=b.time;const nm={2:['DOUBLE KILL','⚡'],3:['TRIPLE KILL','🔥'],4:['MANIAC','💥'],5:['SAVAGE','👑']}[Math.min(p.ms,5)];if(nm)banner('hl',nm[0],p.n+' · '+p.h[0],b.T[ti].col,nm[1],3800)}
window.bcApplyRead=function(r){const b=B;if(!b||!r||typeof r!=='object')return;b.ai=true;b.aiAt=Date.now();const si=t=>((t==='A')!==!!b.swap)?0:1;
 if(typeof r.time==='string'&&/^\d{1,3}:\d\d$/.test(r.time)){const [m,s]=r.time.split(':').map(Number),sec=m*60+s;cf('time',sec,()=>{if(Math.abs(sec-b.time)>2)b.time=sec;if((b.phase==='intro'||b.phase==='draft')&&sec>0){b.phase='play';b.lastTick=performance.now()}})}
 if(r.paused===true)cf('pz',1,()=>{if(b.phase==='play')bcPause()});else if(r.paused===false)cf('pz',0,()=>{if(b.phase==='pause')bcPause()});
 ['A','B'].forEach(t=>{const o=r[t];if(!o)return;const ti=si(t),k=nv(o.kills),g=nv(o.gold),tw=nv(o.towers),tu=nv(o.turtles),lo=nv(o.lords);
  if(k!=null)cf('k'+ti,k,()=>{if(k>b.kills[ti]&&k-b.kills[ti]<=6){const sum=b.T[ti].pl.reduce((s,p)=>s+p.k,0);b.kills[ti]=k;if(k>sum&&!r.players)pushFeed('⚔  '+b.T[ti].name+' secured a kill',b.T[ti].col)}});
  if(g!=null)cf('g'+ti,g,()=>{if(g>=b.gold[ti]-50)b.gold[ti]=g});
  if(tw!=null)cf('tw'+ti,tw,()=>{if(tw>b.towers[ti]&&tw-b.towers[ti]<=3){b.towers[ti]=tw;banner('obj','TOWER DESTROYED',b.T[ti].name+' · '+tw+' towers',b.T[ti].col,'🏰',2600)}});
  if(tu!=null)cf('tu'+ti,tu,()=>{if(tu>b.turtles[ti]&&tu-b.turtles[ti]<=2){b.turtles[ti]=tu;banner('obj','TURTLE SLAIN',b.T[ti].name,b.T[ti].col,'🐢',2800)}});
  if(lo!=null)cf('lo'+ti,lo,()=>{if(lo>b.lords[ti]&&lo-b.lords[ti]<=2){b.lords[ti]=lo;banner('obj','LORD SECURED',b.T[ti].name,b.T[ti].col,'👹',3200)}})});
 if(Array.isArray(r.players)){r.players.forEach(q=>{if(!q||!b.T[si(q.t)])return;const ti=si(q.t),pi=(+q.s||0)-1,p=b.T[ti].pl[pi];if(!p)return;const id=ti+'_'+pi;
  if(typeof q.hero==='string'&&q.hero&&normN(q.hero)!==normN(p.h[0]))cf('h'+id,q.hero,()=>{p.h=(b.pool||[]).find(x=>normN(x[0])===normN(q.hero))||[q.hero,'⭐']});
  const k=nv(q.k),d=nv(q.d),a=nv(q.a),g=nv(q.gold);
  if(k!=null)cf('pk'+id,k,()=>{let n=k-p.k;if(n>0&&n<=5)for(;n>0;n--)aiKill(ti,pi)});
  if(d!=null)cf('pd'+id,d,()=>{if(d>=p.d&&d-p.d<=5)p.d=d});
  if(a!=null)cf('pa'+id,a,()=>{if(a>=p.a&&a-p.a<=8)p.a=a});
  if(g!=null)cf('pg'+id,g,()=>{p.g=g});
  if(Array.isArray(q.items)){const names=q.items.filter(x=>typeof x==='string'&&x).slice(0,6),sig=names.map(normN).join('|');
   cf('pi'+id,sig,()=>{const old=p.items.map(x=>normN(x[0]));if(sig===old.join('|'))return;const added=names.filter(x=>!old.includes(normN(x)));p.items=names.map(mapItem);
    if(added.length&&old.length+added.length>0&&b.time>5){const it=mapItem(added[0]);if(b.phase==='pause')pushFeed('🛒 '+p.n+' bought '+it[0],b.T[ti].col);else if(b.phase==='play')banner('buy','🛒 '+p.n+' bought',it[0],b.T[ti].col,it[1],2600)}})}});
  [0,1].forEach(ti=>{const sum=b.T[ti].pl.reduce((s,p)=>s+p.k,0);if(sum>b.kills[ti])b.kills[ti]=sum});buildPl()}
 if(r.gameOver==='A'||r.gameOver==='B')cf('go',r.gameOver,()=>{if(b.phase==='play'||b.phase==='pause')bcWin(si(r.gameOver))})};

/* ----- host: read from own screen/camera ----- */
window.bcAI=function(){const b=B;if(!b)return;if(b.aiStop){b.aiStop();b.aiStop=null;$('#aiBtn').textContent='▶ Start Auto-Read';$('#aiSt').textContent='Stopped';return}
 const key=($('#aiKey').value||'').trim()||lsGet(AIK);if(!key)return toast('Paste your API key first');lsSet(AIK,key);
 if(!SRC||!VID||!SRC.getVideoTracks().length)return toast('Needs LIVE (screen) or CAMERA mode. On a phone, use a Spotter phone instead.');
 b.auto=false;b.aiStop=aiLoop(VID,{key,model:$('#aiMd').value,game:b.t.game,every:4000},bcApplyRead,m=>{const e=$('#aiSt');if(e)e.textContent=m});$('#aiBtn').textContent='⏹ Stop Auto-Read'};
window.bcSwap=c=>{if(B)B.swap=c};

/* ----- Spotter phone: point any phone at the game, it reads and sends data to the host ----- */
window.bcSpot=function(){openM(`<div class="row"><h2>🎯 Spotter phone</h2><button class="alt" onclick="closeM()">✕</button></div><div class="mut" style="margin-bottom:8px">Use a second phone or tablet. Aim its camera at the screen where the game is playing (or share that screen on desktop). It reads the scoreboard with AI and sends everything to the host automatically.</div>
 <input id="spC" inputmode="numeric" maxlength="6" placeholder="6-digit code from the host"><input id="spK" type="password" placeholder="Anthropic API key (stays on this device)" value="${esc(lsGet(AIK)||'')}">
 <select id="spG">${Object.keys(GAMES).map(g=>`<option>${g}</option>`).join('')}</select><select id="spM"><option value="claude-sonnet-5-5">Accurate (Sonnet)</option><option value="claude-haiku-5-5">Cheaper (Haiku)</option></select>
 <button class="g" style="width:100%;margin-top:8px" onclick="bcSpotGo('cam')">📷 Start with camera (aim at the game screen)</button>${window.hasScreen()?'<button class="alt" style="width:100%;margin-top:8px" onclick="bcSpotGo(\'screen\')">🖥 Start with screen share</button>':''}`)};
window.bcSpotGo=async function(mode){const code=($('#spC').value||'').trim(),key=($('#spK').value||'').trim();if(!/^\d{6}$/.test(code))return toast('Enter the 6-digit code');if(!key)return toast('Paste your API key');lsSet(AIK,key);
 const game=$('#spG').value,model=$('#spM').value;let src;
 try{src=mode==='screen'?await navigator.mediaDevices.getDisplayMedia({video:true}):await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}})}catch(e){return toast('❌ Could not open '+(mode==='screen'?'screen share':'camera')+(e&&e.name?' ('+e.name+')':''))}
 closeM();const d=document.createElement('div');d.id='bsp';d.style.cssText='position:fixed;inset:0;z-index:100002;background:#05070d;color:#fff;padding:12px;font-family:system-ui,sans-serif;overflow:auto';
 d.innerHTML=`<b>🎯 Spotter · code ${code}</b><video id="spV" autoplay playsinline muted style="width:100%;border-radius:12px;margin:8px 0;background:#000"></video><div id="spS" style="font-size:14px;margin:6px 0">Connecting…</div><div style="font-size:12px;color:#8b94ad;margin-bottom:10px">Keep the whole game scoreboard in view and the phone steady. Leave this screen open.</div><button id="spX" style="background:#d92b3a;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700">⏹ Stop spotting</button>`;
 document.body.appendChild(d);const v=$('#spV');v.srcObject=src;v.play().catch(()=>{});let ok=false;
 let pc=null;const ch=sb.channel('spot:'+code,{config:{broadcast:{self:false}}});
 const mkOffer=async()=>{try{if(pc)pc.close()}catch(e){}pc=new RTCPeerConnection(ICE);src.getVideoTracks().forEach(t=>pc.addTrack(t,src));pc.onicecandidate=e=>{if(e.candidate)ch.send({type:'broadcast',event:'ice',payload:{c:e.candidate.toJSON()}})};const o=await pc.createOffer();await pc.setLocalDescription(o);ch.send({type:'broadcast',event:'offer',payload:{sdp:pc.localDescription.toJSON()}})};
 ch.on('broadcast',{event:'ready'},()=>{if(ok&&(!pc||pc.connectionState!=='connected'))mkOffer().catch(()=>{})}).on('broadcast',{event:'answer'},async({payload})=>{try{await pc.setRemoteDescription(payload.sdp);await flushIce(pc)}catch(e){}}).on('broadcast',{event:'ice2'},({payload})=>{if(pc)addIce(pc,payload.c)});
 ch.subscribe(s=>{if(s==='SUBSCRIBED'){ok=true;mkOffer().catch(()=>{})}});
 const stop=aiLoop(v,{key,model,game,every:4000},r=>{if(!ok)throw Error('not connected to host yet');ch.send({type:'broadcast',event:'read',payload:r})},m=>{const e=$('#spS');if(e)e.textContent=m});
 $('#spX').onclick=()=>{stop();try{pc&&pc.close()}catch(e){}try{src.getTracks().forEach(t=>t.stop())}catch(e){}try{sb.removeChannel(ch)}catch(e){}d.remove()}};
const _lv11=live;live=function(){return _lv11()+`<div class="card" style="text-align:center"><b>🎯 Be a Spotter</b><div class="mut" style="margin:4px 0 10px">Second device for an automatic scoreboard: aim the camera at the game and the AI feeds the host live.</div><button class="alt" onclick="bcSpot()">Join as Spotter</button></div>`};

document.addEventListener('fullscreenchange',()=>{const n=$('#bcFs');if(!B||!n)return;if(!document.fullscreenElement){n.style.display='block';try{document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{})}catch(e){}}else n.style.display='none'});

/* ----- Second-device screen: the Spotter's camera/screen video becomes the live game screen (works on any phone) ----- */
async function hostOffer(p){const b=B;if(!b||!p||!p.sdp)return;try{b.rpc&&b.rpc.close()}catch(e){}
 const pc=new RTCPeerConnection(ICE);b.rpc=pc;
 pc.ontrack=e=>{const ms=e.streams[0]||new MediaStream([e.track]);if(!SRC||SRC._remote||!SRC.getVideoTracks().length){ms._remote=1;SRC=ms;VID.srcObject=ms;VID.play().catch(()=>{});toast('📡 Second device connected: its video is now your game screen')}};
 pc.onicecandidate=e=>{if(e.candidate&&B&&B.sc)B.sc.send({type:'broadcast',event:'ice2',payload:{c:e.candidate.toJSON()}})};
 try{await pc.setRemoteDescription(p.sdp);await flushIce(pc);const a=await pc.createAnswer();await pc.setLocalDescription(a);B.sc.send({type:'broadcast',event:'answer',payload:{sdp:pc.localDescription.toJSON()}})}catch(e){}}
})();
</script>
